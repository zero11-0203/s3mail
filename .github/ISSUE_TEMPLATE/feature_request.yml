name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the limitations in the README and the owning spec in docs/ first. For larger changes, agree the design here before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behavior does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, and which spec or component it affects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: The proposal keeps original messages undeletable, never resends a submission with unknown relay acceptance, and keeps least-privilege IAM.
          required: true
