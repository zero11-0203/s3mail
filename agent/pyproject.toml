[project]
name = "s3mail-agent"
version = "0.1.0"
description = "Read-only s3mail assistant (A0): a LangGraph graph on Amazon Bedrock AgentCore that reaches mail only through JMAP."
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "aws-opentelemetry-distro==0.21.0",
    "bedrock-agentcore==1.24.1",
    "boto3>=1.40",
    "httpx==0.28.1",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "langgraph==1.2.16",
    "langgraph-checkpoint-aws==1.2.5",
    "pypdf>=6",
]

[dependency-groups]
dev = [
    "botocore[crt]>=1.40",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3mail_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Fixture data: whole synthetic emails read better unwrapped.
"evals/mailbox.py" = ["E501"]
"evals/triage_cases.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
